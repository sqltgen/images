[package]
name    = "sqltgen-examples-warmup"
version = "0.1.0"
edition = "2021"

# Union of all dependencies used across every sqltgen Rust example.
# Adding all sqlx driver features to a single crate compiles them once
# and leaves the artifacts in the image's cargo registry.
[dependencies]
sqlx         = { version = "0.8", features = ["runtime-tokio-native-tls", "postgres", "mysql", "sqlite", "uuid", "time", "json", "rust_decimal"] }
tokio        = { version = "1",   features = ["full"] }
uuid         = { version = "1",   features = ["v4"] }
time         = "0.3"
serde_json   = "1"
rust_decimal = "1"
dotenvy      = "0.15"
