name: Build and push images

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  toolchain:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: dev-node
            context: toolchain/node
            smoke: "node --version && npm --version"
          - name: dev-python
            context: toolchain/python
            smoke: "python3 --version && pip3 --version"
          - name: dev-jvm
            context: toolchain/jvm
            smoke: "java --version && mvn --version"
          - name: dev-go
            context: toolchain/go
            smoke: "go version"
          - name: dev-rust
            context: toolchain/rust
            smoke: "rustc --version && cargo --version"
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          load: true
          tags: |
            ghcr.io/sqltgen/${{ matrix.name }}:latest
            ghcr.io/sqltgen/${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max

      - name: Smoke test ${{ matrix.name }}
        run: docker run --rm ghcr.io/sqltgen/${{ matrix.name }}:latest sh -c "${{ matrix.smoke }}"

      - name: Push ${{ matrix.name }}
        if: github.ref == 'refs/heads/main'
        run: |
          docker push ghcr.io/sqltgen/${{ matrix.name }}:latest
          docker push ghcr.io/sqltgen/${{ matrix.name }}:${{ github.sha }}

  database:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: db-postgres
            context: db/postgres
          - name: db-mysql
            context: db/mysql
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          load: true
          tags: |
            ghcr.io/sqltgen/${{ matrix.name }}:latest
            ghcr.io/sqltgen/${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max

      - name: Smoke test db-postgres
        if: matrix.name == 'db-postgres'
        run: |
          docker run -d --name pg-smoke -p 5432:5432 ghcr.io/sqltgen/db-postgres:latest
          until docker exec pg-smoke pg_isready -U sqltgen -q; do sleep 0.1; done
          docker exec pg-smoke psql -U sqltgen -c "SELECT 1;"
          docker rm -f pg-smoke

      - name: Smoke test db-mysql
        if: matrix.name == 'db-mysql'
        run: |
          docker run -d --name mysql-smoke -p 3306:3306 ghcr.io/sqltgen/db-mysql:latest
          until docker exec mysql-smoke mysqladmin ping -u sqltgen -psqltgen --silent 2>/dev/null; do sleep 0.2; done
          docker exec mysql-smoke mysql -u sqltgen -psqltgen -e "SELECT 1;"
          docker rm -f mysql-smoke

      - name: Push ${{ matrix.name }}
        if: github.ref == 'refs/heads/main'
        run: |
          docker push ghcr.io/sqltgen/${{ matrix.name }}:latest
          docker push ghcr.io/sqltgen/${{ matrix.name }}:${{ github.sha }}
