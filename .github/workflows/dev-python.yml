name: dev-python

on:
  push:
    branches: [main]
    paths: ['toolchain/python/**']
  pull_request:
    branches: [main]
    paths: ['toolchain/python/**']

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: toolchain/python
          load: true
          tags: |
            ghcr.io/sqltgen/dev-python:latest
            ghcr.io/sqltgen/dev-python:${{ github.sha }}
          cache-from: type=gha,scope=dev-python
          cache-to: type=gha,scope=dev-python,mode=max
      - run: docker run --rm ghcr.io/sqltgen/dev-python:latest sh -c "python3 --version && pip3 --version"
      - name: Push
        if: github.ref == 'refs/heads/main'
        run: |
          docker push ghcr.io/sqltgen/dev-python:latest
          docker push ghcr.io/sqltgen/dev-python:${{ github.sha }}
