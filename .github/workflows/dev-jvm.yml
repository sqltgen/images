name: dev-jvm

on:
  push:
    branches: [main]
    paths: ['toolchain/jvm/**']
  pull_request:
    branches: [main]
    paths: ['toolchain/jvm/**']

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: toolchain/jvm
          load: true
          tags: |
            ghcr.io/sqltgen/dev-jvm:latest
            ghcr.io/sqltgen/dev-jvm:${{ github.sha }}
          cache-from: type=gha,scope=dev-jvm
          cache-to: type=gha,scope=dev-jvm,mode=max
      - run: docker run --rm ghcr.io/sqltgen/dev-jvm:latest sh -c "java --version && mvn --version"
      - name: Push
        if: github.ref == 'refs/heads/main'
        run: |
          docker push ghcr.io/sqltgen/dev-jvm:latest
          docker push ghcr.io/sqltgen/dev-jvm:${{ github.sha }}
