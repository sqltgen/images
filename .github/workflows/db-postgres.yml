name: db-postgres

on:
  push:
    branches: [main]
    paths: ['db/postgres/**']
  pull_request:
    branches: [main]
    paths: ['db/postgres/**']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: db/postgres
          load: true
          tags: |
            ghcr.io/sqltgen/db-postgres:latest
            ghcr.io/sqltgen/db-postgres:${{ github.sha }}
          cache-from: type=gha,scope=db-postgres
          cache-to: type=gha,scope=db-postgres,mode=max
      - name: Smoke test
        run: |
          docker run -d --name pg-smoke -p 5432:5432 ghcr.io/sqltgen/db-postgres:latest
          until docker exec pg-smoke pg_isready -U sqltgen -q; do sleep 0.1; done
          docker exec pg-smoke psql -U sqltgen -c "SELECT 1;"
          docker rm -f pg-smoke
      - name: Push
        if: github.ref == 'refs/heads/main'
        run: |
          docker push ghcr.io/sqltgen/db-postgres:latest
          docker push ghcr.io/sqltgen/db-postgres:${{ github.sha }}
