name: db-mysql

on:
  push:
    branches: [main]
    paths: ['db/mysql/**']
  pull_request:
    branches: [main]
    paths: ['db/mysql/**']

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: db/mysql
          load: true
          tags: |
            ghcr.io/sqltgen/db-mysql:latest
            ghcr.io/sqltgen/db-mysql:${{ github.sha }}
          cache-from: type=gha,scope=db-mysql-v2
          cache-to: type=gha,scope=db-mysql-v2,mode=max
      - name: Smoke test
        run: |
          docker run -d --name mysql-smoke -p 3306:3306 ghcr.io/sqltgen/db-mysql:latest
          until docker exec mysql-smoke mysqladmin ping -u sqltgen -psqltgen --silent 2>/dev/null; do sleep 0.2; done
          docker exec mysql-smoke mysql -u sqltgen -psqltgen -e "SELECT 1;"
          docker rm -f mysql-smoke
      - name: Push
        if: github.ref == 'refs/heads/main'
        run: |
          docker push ghcr.io/sqltgen/db-mysql:latest
          docker push ghcr.io/sqltgen/db-mysql:${{ github.sha }}
