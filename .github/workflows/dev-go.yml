name: dev-go

on:
  push:
    branches: [main]
    paths: ['toolchain/go/**']
  pull_request:
    branches: [main]
    paths: ['toolchain/go/**']

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: toolchain/go
          load: true
          tags: |
            ghcr.io/sqltgen/dev-go:latest
            ghcr.io/sqltgen/dev-go:${{ github.sha }}
          cache-from: type=gha,scope=dev-go
          cache-to: type=gha,scope=dev-go,mode=max
      - run: docker run --rm ghcr.io/sqltgen/dev-go:latest go version
      - name: Push
        if: github.ref == 'refs/heads/main'
        run: |
          docker push ghcr.io/sqltgen/dev-go:latest
          docker push ghcr.io/sqltgen/dev-go:${{ github.sha }}
