name: dev-node

on:
  push:
    branches: [main]
    paths: ['toolchain/node/**']
  pull_request:
    branches: [main]
    paths: ['toolchain/node/**']

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: toolchain/node
          load: true
          tags: |
            ghcr.io/sqltgen/dev-node:latest
            ghcr.io/sqltgen/dev-node:${{ github.sha }}
          cache-from: type=gha,scope=dev-node
          cache-to: type=gha,scope=dev-node,mode=max
      - run: docker run --rm ghcr.io/sqltgen/dev-node:latest sh -c "node --version && npm --version"
      - name: Push
        if: github.ref == 'refs/heads/main'
        run: |
          docker push ghcr.io/sqltgen/dev-node:latest
          docker push ghcr.io/sqltgen/dev-node:${{ github.sha }}
